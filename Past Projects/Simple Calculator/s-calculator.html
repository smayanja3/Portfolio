<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="description" content="Not so great calculator">
	<meta name="keywords" content="calculator, bad, numbers">

	<title>Simple Calculator</title>

	<!-- external CSS link -->
	<link rel="stylesheet" href="css/normalize.css">
	<link rel="stylesheet" href="css/calculator.css">
</head>

<body>
	<section>
	<h1>Simple Calculator</h1>
	<form class="calculator">
		<div class="input">
			<label for="number1">Number 1</label>
			<input type="text" id="number1">
			<label for="number2">Number 2</label>
			<input type="text" id="number2">
		</div>
		<div class="buttonContainer">
			<button id="addi" type="button">ADD (+)</button>
			<button id="sub" type="button">SUB (-)</button>
			<button id="multiply" type="button">MUL (*)</button>
			<button id="divide" type="button">DIV (/)</button>
		</div>
		<h2 id="result">Result</h2>
	</form> 
</section>
	<script type="text/javascript" src="js/calculator.js"></script>
</body>

</html>
